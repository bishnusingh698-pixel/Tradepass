# Scaffold — see docs/flow-templates.md. Verify the keys on shopify.dev and add template.flow
# (exported from the Flow editor) before moving this folder into extensions/.
[[extensions]]
name = "Email staff when an applicant sends more info"
type = "flow_template"
handle = "tradepass-template-info-received-email"
description = "Email staff when an applicant sends more info. Uses Tradepass's Flow triggers."

  [extensions.template]
  categories = ["customers"]
  module = "./template.flow"
  require_app = true
  discoverable = true
  enabled = true
