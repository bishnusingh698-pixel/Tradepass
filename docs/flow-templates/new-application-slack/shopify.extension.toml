# Scaffold — see docs/flow-templates.md. Verify the keys on shopify.dev and add template.flow
# (exported from the Flow editor) before moving this folder into extensions/.
[[extensions]]
name = "Post new wholesale applications to Slack"
type = "flow_template"
handle = "tradepass-template-new-application-slack"
description = "Post new wholesale applications to Slack. Uses Tradepass's Flow triggers."

  [extensions.template]
  categories = ["customers"]
  module = "./template.flow"
  require_app = true
  discoverable = true
  enabled = true
