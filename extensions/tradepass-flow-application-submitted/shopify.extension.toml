# Shopify Flow trigger fired by app/lib/flow.server.ts (emitFlowTrigger).
# Fields must match TRIGGER_FIELDS there (checked by tests/automation-flow.test.ts).
[[extensions]]
name = "Wholesale application submitted"
type = "flow_trigger"
handle = "tradepass-flow-application-submitted"
description = "Runs when someone submits a Tradepass wholesale application."

[settings]

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Application ID"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Company name"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Contact email"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Country"
