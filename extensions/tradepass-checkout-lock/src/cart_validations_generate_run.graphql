# $exemptTags comes from the lock_vars metafield on the Validation (always
# written, possibly as []; a missing value would make the run fail).
query CartValidationsGenerateRunInput($exemptTags: [String!]!) {
  buyerJourney {
    step
  }
  cart {
    buyerIdentity {
      customer {
        exempt: hasAnyTag(tags: $exemptTags)
      }
      purchasingCompany {
        company {
          id
          # Set by Tradepass while the buyer is paused (REVIEW N1): no wholesale checkout.
          paused: metafield(namespace: "$app:tradepass", key: "paused") {
            value
          }
        }
      }
    }
    lines {
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            isGiftCard
          }
        }
      }
    }
  }
  localization {
    language {
      isoCode
    }
  }
  validation {
    config: metafield(namespace: "$app:tradepass", key: "lock_config") {
      jsonValue
    }
  }
}
