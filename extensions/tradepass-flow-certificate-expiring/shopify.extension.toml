# Shopify Flow trigger fired by app/lib/flow.server.ts (emitFlowTrigger).
# Fields must match TRIGGER_FIELDS there (checked by tests/automation-flow.test.ts).
[[extensions]]
name = "Certificate expiring"
type = "flow_trigger"
handle = "tradepass-flow-certificate-expiring"
description = "Runs when a wholesale buyer's tax or resale certificate will expire soon."

[settings]

  [[settings.fields]]
  type = "company_reference"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Buyer ID"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Company name"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Contact email"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Country"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Tier"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Expiry date"
